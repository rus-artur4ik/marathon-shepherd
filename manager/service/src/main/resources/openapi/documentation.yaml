openapi: 3.1.0
info:
  title: Marathon Shepherd Manager API
  version: "__VERSION__"
  summary: Control plane that leases Android test devices to CI jobs, developers and bots.
  description: |
    The manager schedules **sessions**. A session asks for up to N devices matching a
    capability (API level, physical or emulator). It stays `PENDING` in a FIFO queue until
    matching devices are free, then becomes `READY` with the adb server endpoints to use.
    Release it when done; sessions past their TTL are reclaimed automatically, so a crashed
    client cannot strand a device.

    Every `/api/v1` call authenticates with an API key: `Authorization: Bearer <key>`.
    Keys belong to named clients with a role (`admin`, `user`, `viewer`, `provider`) and
    optional quotas. The probes (`/live`, `/ready`, `/health`), `/metrics` and this
    document stay public; keep the manager port on a trusted network.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: sessions
    description: Request devices, wait for them and give them back.
  - name: devices
    description: What the fleet holds right now.
  - name: config
    description: Provider configuration (`msh.yaml`).
  - name: access
    description: API clients, keys, quotas and the audit log.
  - name: operations
    description: Probes, metrics and this document.
paths:
  /live:
    get:
      tags: [operations]
      operationId: getLiveness
      security: []
      summary: Process liveness
      description: Answers as long as the process runs. Never touches a dependency.
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /ready:
    get:
      tags: [operations]
      operationId: getReadiness
      security: []
      summary: Readiness to serve the API
      description: Checks the state database. Use it for load-balancer and Kubernetes readiness probes.
      responses:
        "200":
          description: Ready to serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Not ready; the database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /health:
    get:
      tags: [operations]
      operationId: getHealth
      security: []
      summary: Fleet health
      description: |
        Provider health, pool sizes and session counts from the background snapshot, which
        is refreshed every `monitoring.providerPollIntervalSeconds`. Returns 503 when no
        provider is healthy.
      responses:
        "200":
          description: At least one provider is healthy (`healthy` or `degraded`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: No provider is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /metrics:
    get:
      tags: [operations]
      operationId: getMetrics
      security: []
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition format 0.0.4.
          content:
            text/plain:
              schema:
                type: string
  /openapi.yaml:
    get:
      tags: [operations]
      operationId: getOpenApiDocument
      security: []
      summary: This document
      description: Swagger UI for it is served at `/docs`.
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List sessions
      parameters:
        - name: owner
          in: query
          description: "`me` for the caller's own sessions, or a client name."
          schema:
            type: string
        - name: status
          in: query
          description: Only sessions in this status. Without it, PENDING, READY and FAILED sessions are listed.
          schema:
            $ref: "#/components/schemas/SessionStatus"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Matching sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      tags: [sessions]
      operationId: createSession
      summary: Request devices
      description: |
        Returns `READY` when at least one matching device could be allocated immediately,
        otherwise `PENDING` with a `queuePosition`. Poll with
        `POST /api/v1/sessions/{id}/wait` until it is `READY`. When no registered device
        can ever satisfy the request, the call fails with 503 instead of queueing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getSession
      summary: Get a session
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [sessions]
      operationId: releaseSession
      summary: Release a session
      description: Returns every lease to its provider. Releasing an already released session succeeds.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The session was released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{id}/wait:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: waitForSession
      summary: Long-poll a queued session
      description: |
        Waits up to `timeoutSeconds` (at most 30) for the session to leave `PENDING`, and
        refreshes its heartbeat. A `PENDING` session that nobody waits on for 90 seconds is
        dropped from the queue.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitSessionRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The session after the wait; still `PENDING` if the timeout elapsed first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/devices:
    get:
      tags: [devices]
      operationId: listProviders
      summary: Fleet inventory by provider
      parameters:
        - name: refresh
          in: query
          description: Poll every adapter now instead of answering from the background snapshot.
          schema:
            type: boolean
            default: false
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Every active provider with its pool, inventory and access descriptors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesResponse"
  /api/v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Active configuration
      description: Adapter secrets are replaced with `<redacted>`.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The active configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShepherdConfig"
    put:
      tags: [config]
      operationId: updateConfig
      summary: Replace the configuration
      description: |
        Writes `msh.yaml` and applies it. A provider secret sent back as `<redacted>` keeps
        its stored value. Removing a provider that still holds leases fails with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShepherdConfig"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The configuration now in effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShepherdConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/config/reload:
    post:
      tags: [config]
      operationId: reloadConfig
      summary: Re-read msh.yaml from disk
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The configuration now in effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShepherdConfig"
  /api/v1/me:
    get:
      tags: [access]
      operationId: whoAmI
      summary: The calling client
      description: Name, role, quota in force and current usage of the key that made the call.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
  /api/v1/audit:
    get:
      tags: [access]
      operationId: listAuditEntries
      summary: Audit log
      description: Newest first. Admins see every entry; other roles see only their own.
      parameters:
        - name: action
          in: query
          description: Action prefix, e.g. `session.` or `client.revoke`.
          schema:
            type: string
        - name: actor
          in: query
          description: Client name (admins only).
          schema:
            type: string
        - name: target
          in: query
          description: Exact target, e.g. a session id or client name.
          schema:
            type: string
        - name: before
          in: query
          description: Only entries older than this id; pass `nextBefore` from the previous page.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: One page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
  /api/v1/admin/clients:
    get:
      tags: [access]
      operationId: listClients
      summary: List API clients
      parameters:
        - name: includeRevoked
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Clients, without their keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      tags: [access]
      operationId: createClient
      summary: Create an API client
      description: The response carries the new key. It is shown exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The client and its key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/clients/{id}:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      tags: [access]
      operationId: getClient
      summary: Get an API client
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [access]
      operationId: updateClient
      summary: Change a client's role, description or quota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The updated client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [access]
      operationId: revokeClient
      summary: Revoke a client's key
      description: |
        The key stops working immediately. The client's sessions keep running unless
        `releaseSessions=true`. The last active admin cannot be revoked unless
        `MSH_ADMIN_TOKEN` is configured.
      parameters:
        - name: releaseSessions
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The revoked client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/clients/{id}/rotate:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    post:
      tags: [access]
      operationId: rotateClientKey
      summary: Replace a client's key
      description: The old key stops working immediately; the new one is shown exactly once.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The client and its new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientKeyResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "An API key: `Authorization: Bearer msh_...`."
  parameters:
    ClientId:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: cli_0123456789ab
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: sess_a1b2c3d4
  responses:
    Unauthorized:
      description: No API key, or an unknown or revoked one.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The key's role does not allow this operation, or the session belongs to someone else.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: The client's device quota is exhausted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The change conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The request cannot be served, e.g. no registered device matches it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [released]
    SessionStatus:
      type: string
      enum: [PENDING, READY, FAILED, RELEASED, EXPIRED]
    AdbServer:
      type: object
      description: An adb server endpoint, e.g. `adb -H host -P port devices`.
      required: [host, port]
      properties:
        host:
          type: string
        port:
          type: integer
    CreateSessionRequest:
      type: object
      properties:
        maxDevices:
          type: integer
          minimum: 1
          default: 1
          description: Upper bound for parallelism, not a strict requirement.
        api:
          type: string
          description: "API level selector: `34`, `>=34`, `<34`, `34+`, `33..35` or `33,34,35`. Omit for any level."
          examples: [">=34"]
        ttlSeconds:
          type: integer
          format: int64
          minimum: 1
          default: 3600
        deviceType:
          type: string
          enum: [physical, emulator]
          description: Omit to use every capable provider.
        devices:
          type: integer
          deprecated: true
          description: Legacy alias of `maxDevices`.
        apiLevel:
          type: string
          deprecated: true
          description: Legacy alias of `api`.
    WaitSessionRequest:
      type: object
      properties:
        timeoutSeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 30
          default: 20
    Session:
      type: object
      required: [id, status, requestedDevices, allocatedDevices, adbServers, createdAt, expiresAt]
      properties:
        id:
          type: string
          examples: [sess_a1b2c3d4]
        status:
          $ref: "#/components/schemas/SessionStatus"
        requestedDevices:
          type: integer
        allocatedDevices:
          type: integer
        api:
          type: string
        deviceType:
          type: string
        adbServers:
          type: array
          items:
            $ref: "#/components/schemas/AdbServer"
        queuePosition:
          type: integer
          description: 1-based position in the queue while `PENDING`.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        owner:
          type: string
          description: Name of the client that created the session.
    PoolStatus:
      type: object
      required: [available, busy, total]
      properties:
        available:
          type: integer
        busy:
          type: integer
        total:
          type: integer
    DevicesResponse:
      type: object
      required: [providers, totalAvailable, totalBusy]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderStatus"
        totalAvailable:
          type: integer
        totalBusy:
          type: integer
    ProviderStatus:
      type: object
      required: [name, adbHost, adbPort, access, capabilities, inventory, pool, status]
      properties:
        name:
          type: string
        adbHost:
          type: string
        adbPort:
          type: integer
        access:
          $ref: "#/components/schemas/AdapterAccess"
        capabilities:
          $ref: "#/components/schemas/AdapterCapabilities"
        inventory:
          type: array
          items:
            $ref: "#/components/schemas/AdapterDeviceProfile"
        pool:
          $ref: "#/components/schemas/PoolStatus"
        status:
          type: string
          enum: [HEALTHY, UNREACHABLE]
    AdapterAccess:
      type: object
      properties:
        preferredConnectionId:
          type: string
        connections:
          type: array
          items:
            $ref: "#/components/schemas/AdapterConnection"
        metadata:
          type: object
          additionalProperties:
            type: string
    AdapterConnection:
      type: object
      required: [id, protocol, transport, host, port, exposure]
      properties:
        id:
          type: string
        protocol:
          type: string
          examples: [adb]
        transport:
          type: string
          examples: [tcp]
        host:
          type: string
        port:
          type: integer
        exposure:
          type: string
          examples: [direct-tcp]
        auth:
          $ref: "#/components/schemas/AdapterConnectionAuth"
        metadata:
          type: object
          additionalProperties:
            type: string
    AdapterConnectionAuth:
      type: object
      properties:
        type:
          type: string
          default: network
        metadata:
          type: object
          additionalProperties:
            type: string
    AdapterCapabilities:
      type: object
      properties:
        allocationModes:
          type: array
          items:
            type: string
        supportedProtocols:
          type: array
          items:
            type: string
        supportedExposureModes:
          type: array
          items:
            type: string
        supportedDeviceTypes:
          type: array
          items:
            type: string
        supportedApiLevels:
          type: array
          items:
            type: string
        supportsSelectiveApiAllocation:
          type: boolean
        supportsTestAccessAdb:
          type: boolean
        supportsTestAccessGrpc:
          type: boolean
        supportsTestAccessConsole:
          type: boolean
        features:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    AdapterDeviceProfile:
      type: object
      required: [deviceType, count]
      properties:
        deviceType:
          type: string
        apiLevel:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        abi:
          type: string
        count:
          type: integer
        metadata:
          type: object
          additionalProperties:
            type: string
    LivenessResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          examples: [alive]
        version:
          type: string
    ReadinessResponse:
      type: object
      required: [status, version, checks]
      properties:
        status:
          type: string
          enum: [ready, not-ready]
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
    ProviderHealthSummary:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [HEALTHY, UNREACHABLE]
        available:
          type: integer
        busy:
          type: integer
        total:
          type: integer
        error:
          type: string
    SessionCounts:
      type: object
      required: [pending, ready, allocatedDevices]
      properties:
        pending:
          type: integer
        ready:
          type: integer
        allocatedDevices:
          type: integer
    HealthResponse:
      type: object
      required: [status, version, providersTotal, providersHealthy, providers]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        providersTotal:
          type: integer
        providersHealthy:
          type: integer
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderHealthSummary"
        sessions:
          $ref: "#/components/schemas/SessionCounts"
        checkedAt:
          type: string
          format: date-time
    ProviderConfig:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
        url:
          type: string
          description: Base URL of the adapter, e.g. `http://192.168.1.10:7037`.
        accessHost:
          type: string
          description: Host published to test runners when it differs from the host in `url`.
        secret:
          type: string
          description: Bearer token matching the adapter's `ADAPTER_SECRET`. Returned as `<redacted>`.
    NoDeviceStrategyConfig:
      type: object
      properties:
        mode:
          type: string
          enum: [FAIL_IMMEDIATELY, WAIT_WITH_TIMEOUT]
        waitTimeoutSeconds:
          type: integer
          format: int64
    MonitoringConfig:
      type: object
      properties:
        providerPollIntervalSeconds:
          type: integer
          format: int64
          default: 10
        providerPollTimeoutSeconds:
          type: integer
          format: int64
          default: 5
    AdapterTimeoutsConfig:
      type: object
      properties:
        healthSeconds:
          type: integer
          format: int64
          default: 5
        statusSeconds:
          type: integer
          format: int64
          default: 10
        acquireSeconds:
          type: integer
          format: int64
          default: 600
        releaseSeconds:
          type: integer
          format: int64
          default: 60
    ShepherdConfig:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderConfig"
        noDeviceStrategy:
          $ref: "#/components/schemas/NoDeviceStrategyConfig"
        monitoring:
          $ref: "#/components/schemas/MonitoringConfig"
        adapterTimeouts:
          $ref: "#/components/schemas/AdapterTimeoutsConfig"
        quotas:
          $ref: "#/components/schemas/QuotasConfig"
        audit:
          $ref: "#/components/schemas/AuditConfig"
    QuotasConfig:
      type: object
      properties:
        defaults:
          $ref: "#/components/schemas/Quota"
    AuditConfig:
      type: object
      properties:
        retentionDays:
          type: integer
          format: int64
          default: 90
    Quota:
      type: object
      description: Client limits; an absent or null field is not limited.
      properties:
        maxDevices:
          type: [integer, "null"]
          minimum: 1
          description: Devices the client may hold or wait for at once.
        maxSessionLifetimeSeconds:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: Upper bound for a session's life; longer TTLs are shortened.
        maxPriority:
          type: [integer, "null"]
          minimum: 0
    Role:
      type: string
      enum: [admin, user, viewer, provider]
    Client:
      type: object
      required: [id, name, role, keyPrefix, active, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        keyPrefix:
          type: string
          description: First characters of the key; the key itself is shown only once.
        description:
          type: string
        quota:
          $ref: "#/components/schemas/Quota"
        effectiveQuota:
          $ref: "#/components/schemas/Quota"
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    CreateClientRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
        role:
          $ref: "#/components/schemas/Role"
        description:
          type: string
        quota:
          $ref: "#/components/schemas/Quota"
    UpdateClientRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
        description:
          type: string
        quota:
          $ref: "#/components/schemas/Quota"
    ClientKeyResponse:
      type: object
      required: [client, apiKey]
      properties:
        client:
          $ref: "#/components/schemas/Client"
        apiKey:
          type: string
          description: Shown exactly once.
    Usage:
      type: object
      required: [activeSessions, devices]
      properties:
        activeSessions:
          type: integer
        devices:
          type: integer
    WhoAmI:
      type: object
      required: [id, name, role, quota, usage]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        quota:
          $ref: "#/components/schemas/Quota"
        usage:
          $ref: "#/components/schemas/Usage"
    AuditEntry:
      type: object
      required: [id, at, actor, action, outcome]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actor:
          type: string
        actorId:
          type: string
        action:
          type: string
          examples: [session.create]
        target:
          type: string
        outcome:
          type: string
          enum: [success, denied, failed]
        details:
          type: object
          additionalProperties:
            type: string
        origin:
          type: string
    AuditPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextBefore:
          type: integer
          format: int64
