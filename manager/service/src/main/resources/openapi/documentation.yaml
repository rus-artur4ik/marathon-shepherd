openapi: 3.1.0
info:
  title: Marathon Shepherd Manager API
  version: "__VERSION__"
  summary: Control plane that leases Android test devices to CI jobs, developers and bots.
  description: |
    The manager schedules **sessions**. A session asks for up to N devices matching a
    capability (API level, physical or emulator). It stays `PENDING` in a FIFO queue until
    matching devices are free, then becomes `READY` with the adb server endpoints to use.
    Release it when done; sessions past their TTL are reclaimed automatically, so a crashed
    client cannot strand a device.

    Every `/api/v1` call authenticates with an API key: `Authorization: Bearer <key>`.
    Keys belong to named clients with a role (`admin`, `user`, `viewer`, `provider`) and
    optional quotas. The probes (`/live`, `/ready`, `/health`), `/metrics` and this
    document stay public; keep the manager port on a trusted network.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: sessions
    description: Request devices, wait for them and give them back.
  - name: devices
    description: What the fleet holds right now.
  - name: config
    description: Provider configuration (`msh.yaml`).
  - name: access
    description: API clients, keys, quotas and the audit log.
  - name: providers
    description: Adapters, configured or self-registered.
  - name: events
    description: Live stream of what the manager does.
  - name: mcp
    description: Model Context Protocol endpoint for AI agents
  - name: people
    description: Signing in, users and personal API tokens.
  - name: operations
    description: Probes, metrics and this document.
paths:
  /live:
    get:
      tags: [operations]
      operationId: getLiveness
      security: []
      summary: Process liveness
      description: Answers as long as the process runs. Never touches a dependency.
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /ready:
    get:
      tags: [operations]
      operationId: getReadiness
      security: []
      summary: Readiness to serve the API
      description: Checks the state database. Use it for load-balancer and Kubernetes readiness probes.
      responses:
        "200":
          description: Ready to serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Not ready; the database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /health:
    get:
      tags: [operations]
      operationId: getHealth
      security: []
      summary: Fleet health
      description: |
        Provider health, pool sizes and session counts from the background snapshot, which
        is refreshed every `monitoring.providerPollIntervalSeconds`. Returns 503 when no
        provider is healthy.
      responses:
        "200":
          description: At least one provider is healthy (`healthy` or `degraded`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: No provider is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /metrics:
    get:
      tags: [operations]
      operationId: getMetrics
      security: []
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition format 0.0.4.
          content:
            text/plain:
              schema:
                type: string
  /openapi.yaml:
    get:
      tags: [operations]
      operationId: getOpenApiDocument
      security: []
      summary: This document
      description: Swagger UI for it is served at `/docs`.
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List sessions
      parameters:
        - name: owner
          in: query
          description: "`me` for the caller's own sessions, or a client name."
          schema:
            type: string
        - name: status
          in: query
          description: Only sessions in this status. Without it, PENDING, READY and FAILED sessions are listed.
          schema:
            $ref: "#/components/schemas/SessionStatus"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Matching sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      tags: [sessions]
      operationId: createSession
      summary: Request devices
      description: |
        Returns `READY` when at least one matching device could be allocated immediately,
        otherwise `PENDING` with a `queuePosition`. Poll with
        `POST /api/v1/sessions/{id}/wait` until it is `READY`. When no registered device
        can ever satisfy the request, the call fails with 503 instead of queueing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getSession
      summary: Get a session
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [sessions]
      operationId: releaseSession
      summary: Release a session
      description: Returns every lease to its provider. Releasing an already released session succeeds.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The session was released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{id}/wait:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: waitForSession
      summary: Long-poll a queued session
      description: |
        Waits up to `timeoutSeconds` (at most 30) for the session to leave `PENDING`, and
        refreshes its heartbeat. A `PENDING` session that nobody waits on for 90 seconds is
        dropped from the queue.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitSessionRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The session after the wait; still `PENDING` if the timeout elapsed first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: Fleet inventory, by provider and device by device
      description: |
        `providers` summarises every provider's pool. `devices` lists individual devices of
        providers that report them (shepherd-adb does; pool-only farms do not), after the filters.
      parameters:
        - name: refresh
          in: query
          description: Poll every adapter now instead of answering from the background snapshot.
          schema:
            type: boolean
            default: false
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/DeviceState"
        - name: provider
          in: query
          schema:
            type: string
        - name: deviceType
          in: query
          schema:
            type: string
            enum: [physical, emulator]
        - name: api
          in: query
          description: API level selector, same syntax as in session requests.
          schema:
            type: string
        - name: label
          in: query
          description: "`key=value`; repeat to require several labels."
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Every active provider with its pool, inventory and access descriptors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesResponse"
  /api/v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Active configuration
      description: Adapter secrets are replaced with `<redacted>`.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The active configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShepherdConfig"
    put:
      tags: [config]
      operationId: updateConfig
      summary: Replace the configuration
      description: |
        Writes `msh.yaml` and applies it. A provider secret sent back as `<redacted>` keeps
        its stored value. Removing a provider that still holds leases fails with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShepherdConfig"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The configuration now in effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShepherdConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/config/reload:
    post:
      tags: [config]
      operationId: reloadConfig
      summary: Re-read msh.yaml from disk
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The configuration now in effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShepherdConfig"
  /api/v1/me:
    get:
      tags: [access]
      operationId: whoAmI
      summary: The calling client
      description: Name, role, quota in force and current usage of the key that made the call.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
  /api/v1/audit:
    get:
      tags: [access]
      operationId: listAuditEntries
      summary: Audit log
      description: Newest first. Admins see every entry; other roles see only their own.
      parameters:
        - name: action
          in: query
          description: Action prefix, e.g. `session.` or `client.revoke`.
          schema:
            type: string
        - name: actor
          in: query
          description: Client name (admins only).
          schema:
            type: string
        - name: target
          in: query
          description: Exact target, e.g. a session id or client name.
          schema:
            type: string
        - name: before
          in: query
          description: Only entries older than this id; pass `nextBefore` from the previous page.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: One page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
  /api/v1/admin/clients:
    get:
      tags: [access]
      operationId: listClients
      summary: List API clients
      parameters:
        - name: includeRevoked
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Clients, without their keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      tags: [access]
      operationId: createClient
      summary: Create an API client
      description: The response carries the new key. It is shown exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The client and its key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/clients/{id}:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      tags: [access]
      operationId: getClient
      summary: Get an API client
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [access]
      operationId: updateClient
      summary: Change a client's role, description or quota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The updated client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [access]
      operationId: revokeClient
      summary: Revoke a client's key
      description: |
        The key stops working immediately. The client's sessions keep running unless
        `releaseSessions=true`. The last active admin cannot be revoked unless
        `MSH_ADMIN_TOKEN` is configured.
      parameters:
        - name: releaseSessions
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The revoked client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/clients/{id}/rotate:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    post:
      tags: [access]
      operationId: rotateClientKey
      summary: Replace a client's key
      description: The old key stops working immediately; the new one is shown exactly once.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The client and its new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientKeyResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      tags: [devices]
      operationId: getDevice
      summary: One device
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/devices/{id}/maintenance:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    put:
      tags: [devices]
      operationId: enterMaintenance
      summary: Put a device into maintenance
      description: |
        The device is never allocated while in maintenance. A session holding it keeps it
        until released. Admin only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The device, now in maintenance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [devices]
      operationId: leaveMaintenance
      summary: Take a device out of maintenance
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Cleared, or the device was not in maintenance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /api/v1/sessions/{id}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: heartbeatSession
      summary: Keep a session alive
      description: |
        Keeps a queued session in line and stops a ready session with `idleTimeoutSeconds`
        from being released as idle. Owner or admin.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{id}/extend:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: extendSession
      summary: Change a session's remaining lifetime
      description: |
        Sets the expiry to `ttlSeconds` from now, bounded by the client's
        `maxSessionLifetimeSeconds`. For a ready session every lease is renewed first; if a
        provider cannot renew leases the call fails with 409 and nothing changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendSessionRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The session with its new expiry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/providers:
    get:
      tags: [providers]
      operationId: listProviderRegistrations
      summary: Providers from msh.yaml and self-registered adapters
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Every known provider.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderInfo"
  /api/v1/providers/register:
    post:
      tags: [providers]
      operationId: registerProvider
      summary: Register an adapter, or heartbeat an existing registration
      description: |
        Called by adapters with a `provider` key (see `MSH_MANAGER_URL` and
        `MSH_REGISTRATION_TOKEN` on the adapter). Repeat at least every
        `heartbeatIntervalSeconds`; a registration without a heartbeat for `ttlSeconds`
        receives no new sessions. A name belongs to the client that registered it first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderRegistrationRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderRegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/providers/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [providers]
      operationId: deregisterProvider
      summary: Remove a self-registered provider
      description: Admin only. Refused while the provider holds devices for active sessions.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Server-sent event stream
      description: |
        Session, device and provider events as `text/event-stream`. Each event has an `id`,
        an `event` type and a JSON `data` line (an Event). Reconnect with `Last-Event-ID` to
        receive the buffered events you missed. The buffer holds the last 1000 events and
        ids restart with the manager.
      parameters:
        - name: types
          in: query
          description: Comma-separated type prefixes, e.g. `session.,provider.down`.
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            format: int64
        - name: lastEventId
          in: query
          description: Same as the `Last-Event-ID` header, for clients that cannot set headers.
          schema:
            type: integer
            format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The stream; it stays open.
          content:
            text/event-stream:
              schema:
                type: string
  /mcp:
    post:
      tags: [mcp]
      operationId: mcp
      summary: Model Context Protocol (Streamable HTTP, stateless)
      description: |
        JSON-RPC 2.0 messages from an MCP client such as Claude Code. Each request is handled on
        its own and answered with JSON; there is no event stream and no Mcp-Session-Id. The tools
        act as the calling key's client: list_devices, acquire_devices, wait_for_session,
        get_session, list_my_sessions, extend_session and release_session. Sessions opened here
        follow the `mcp` limits in msh.yaml. See docs/mcp.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC 2.0 request or notification.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The JSON-RPC response.
          content:
            application/json:
              schema:
                type: object
        "202":
          description: A notification was accepted; there is no body.
        "404":
          description: The endpoint is turned off (`mcp.enabled` is false).
  /api/v1/auth/methods:
    get:
      tags: [people]
      operationId: authMethods
      summary: How people can sign in
      description: Local passwords, LDAP and the OIDC providers configured in msh.yaml, for a sign-in page.
      security: []
      responses:
        "200":
          description: The sign-in methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethods"
  /api/v1/auth/login:
    post:
      tags: [people]
      operationId: login
      summary: Sign in with a username and password
      description: |
        Checks a local account, then LDAP, and starts a browser session. The answer sets the
        `msh_session` cookie and carries the CSRF token that every change made with that cookie must
        send in `X-CSRF-Token`. Repeated failures lock the username out for a while.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSession"
        "401":
          $ref: "#/components/responses/SignInFailed"
        "429":
          $ref: "#/components/responses/LockedOut"
  /api/v1/auth/tokens:
    post:
      tags: [people]
      operationId: loginForToken
      summary: Sign in with a password and get a personal API token
      description: For mshctl and scripts. The token is shown once; send it as a bearer key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenLoginRequest"
      responses:
        "201":
          description: The token, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedToken"
        "401":
          $ref: "#/components/responses/SignInFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/LockedOut"
  /api/v1/auth/password:
    post:
      tags: [people]
      operationId: changePasswordWithLogin
      summary: Change a password without a session
      description: For someone holding a temporary password who signs in from the command line.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordWithLoginRequest"
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInFailed"
        "429":
          $ref: "#/components/responses/LockedOut"
  /api/v1/auth/session:
    get:
      tags: [people]
      operationId: browserSession
      summary: The signed-in browser session
      description: Who is signed in and the CSRF token for changes. Only for requests carrying the session cookie.
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/logout:
    post:
      tags: [people]
      operationId: logout
      summary: End the browser session
      responses:
        "204":
          description: Signed out; the cookie is cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/oidc/{provider}/login:
    parameters:
      - $ref: "#/components/parameters/OidcProvider"
    get:
      tags: [people]
      operationId: oidcLogin
      summary: Start signing in with an OIDC provider
      security: []
      parameters:
        - name: returnTo
          in: query
          description: A path on this manager to land on after signing in.
          schema:
            type: string
      responses:
        "302":
          description: |
            To the provider's sign-in page. When the provider cannot be used (unreachable, or a
            broken OpenID configuration), back to the web UI's sign-in page, with the reason kept
            for `GET /api/v1/auth/methods` as for a failed callback.
  /auth/oidc/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/OidcProvider"
    get:
      tags: [people]
      operationId: oidcCallback
      summary: Where the OIDC provider sends the browser back
      description: Register `<auth.publicUrl>/auth/oidc/<id>/callback` as the redirect URI with the provider.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
      responses:
        "302":
          description: |
            Signed in: the session cookie is set and the browser goes to `returnTo`. Not signed in:
            the browser goes to the web UI's sign-in page, and the reason waits in a short-lived
            cookie that `GET /api/v1/auth/methods` returns once as `signInError`.
  /api/v1/me/setup:
    post:
      tags: [people]
      operationId: setUpAccount
      summary: Finish a first sign-in
      description: >
        Replaces the one-time password of the signed-in account with one of its own. The session
        was opened with that very password, so it is not asked for again. On the account the
        manager created at first start (`unclaimed`), `username` and `displayName` name it after
        the person taking it over; every other account keeps its name. Other browser sessions of
        the account end.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUpAccountRequest"
      responses:
        "200":
          description: The account as it stands now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/me/password:
    post:
      tags: [people]
      operationId: changePassword
      summary: Change your own password
      description: Local accounts only. Other browser sessions of the account end.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/me/tokens:
    get:
      tags: [people]
      operationId: listPersonalTokens
      summary: Your personal API tokens
      responses:
        "200":
          description: Tokens that are not revoked.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [people]
      operationId: createPersonalToken
      summary: Create a personal API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: The token, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/me/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [people]
      operationId: revokePersonalToken
      summary: Revoke one of your personal API tokens
      responses:
        "200":
          description: The revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/users:
    get:
      tags: [people]
      operationId: listUsers
      summary: People who sign in (admin)
      parameters:
        - name: includeDisabled
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [people]
      operationId: createUser
      summary: Create a local user (admin)
      description: Without a password a temporary one is generated. Either way it must be changed at first sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The user, and the temporary password when one was generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [people]
      operationId: getUser
      summary: One user (admin)
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [people]
      operationId: updateUser
      summary: Change a user's profile, role, quota or whether they are active (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [people]
      operationId: disableUser
      summary: Disable a user (admin)
      description: Signs them out everywhere; their personal tokens stop working. `releaseSessions=true` also frees their devices.
      parameters:
        - name: releaseSessions
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: The disabled user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [people]
      operationId: resetUserPassword
      summary: Reset a local user's password (admin)
      description: The new password must be changed at the next sign-in. Without a body a temporary one is generated.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: The temporary password when one was generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/users/{id}/tokens:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [people]
      operationId: listUserTokens
      summary: A user's personal tokens, revoked ones included (admin)
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/users/{id}/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [people]
      operationId: revokeUserToken
      summary: Revoke a user's personal token (admin)
      responses:
        "200":
          description: The revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "An API key: `Authorization: Bearer msh_...`."
    sessionCookie:
      type: apiKey
      in: cookie
      name: msh_session
      description: |
        The web UI's session, from POST /api/v1/auth/login or an OIDC sign-in. Requests that change
        anything must also send the session's CSRF token in the `X-CSRF-Token` header.
  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      description: Global device id, `<provider>:<device id>`.
      schema:
        type: string
      example: "rack-1:R58M123ABC"
    ClientId:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: cli_0123456789ab
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: sess_a1b2c3d4
    UserId:
      name: id
      in: path
      required: true
      description: User id, e.g. `usr_...`.
      schema:
        type: string
    TokenId:
      name: id
      in: path
      required: true
      description: Personal token id, e.g. `tok_...`.
      schema:
        type: string
    OidcProvider:
      name: provider
      in: path
      required: true
      description: The id of an OIDC provider under `auth.oidc` in msh.yaml.
      schema:
        type: string
  responses:
    Unauthorized:
      description: No API key, or an unknown or revoked one.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The key's role does not allow this operation, or the session belongs to someone else.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: The client's device quota is exhausted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The change conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The request cannot be served, e.g. no registered device matches it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SignInFailed:
      description: Wrong username or password, or the directory refused the sign-in. The message never says whether the account exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LockedOut:
      description: Too many failed sign-ins for this username or address; try again after `Retry-After` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [released]
    SessionStatus:
      type: string
      enum: [PENDING, READY, FAILED, RELEASED, EXPIRED]
    AdbServer:
      type: object
      description: An adb server endpoint, e.g. `adb -H host -P port devices`.
      required: [host, port]
      properties:
        host:
          type: string
        port:
          type: integer
    CreateSessionRequest:
      type: object
      properties:
        maxDevices:
          type: integer
          minimum: 1
          default: 1
          description: Upper bound for parallelism, not a strict requirement.
        api:
          type: string
          description: "API level selector: `34`, `>=34`, `<34`, `34+`, `33..35` or `33,34,35`. Omit for any level."
          examples: [">=34"]
        ttlSeconds:
          type: integer
          format: int64
          minimum: 1
          default: 3600
        deviceType:
          type: string
          enum: [physical, emulator]
          description: Omit to use every capable provider.
        devices:
          type: integer
          deprecated: true
          description: Legacy alias of `maxDevices`.
        apiLevel:
          type: string
          deprecated: true
          description: Legacy alias of `api`.
        deviceIds:
          type: array
          maxItems: 64
          description: Global ids of the only devices this session may receive. Without `maxDevices`, asks for all of them.
          items:
            type: string
        labels:
          type: object
          description: Every device must carry all of these labels.
          additionalProperties:
            type: string
        name:
          type: string
          maxLength: 200
          description: Display name, e.g. a CI job and build number.
        metadata:
          type: object
          description: Free-form key/value pairs returned with the session.
          additionalProperties:
            type: string
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: Queue priority under the `priority` scheduler; limited by the client's `maxPriority`.
        idleTimeoutSeconds:
          type: integer
          format: int64
          minimum: 30
          description: Release the session when it stays READY without a heartbeat this long.
    ExtendSessionRequest:
      type: object
      required: [ttlSeconds]
      properties:
        ttlSeconds:
          type: integer
          format: int64
          minimum: 1
    SessionDevice:
      type: object
      required: [id, provider, localId]
      properties:
        id:
          type: string
        provider:
          type: string
        localId:
          type: string
        adbServer:
          $ref: "#/components/schemas/AdbServer"
        model:
          type: string
        apiLevel:
          type: string
    WaitSessionRequest:
      type: object
      properties:
        timeoutSeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 30
          default: 20
    Session:
      type: object
      required: [id, status, requestedDevices, allocatedDevices, adbServers, createdAt, expiresAt]
      properties:
        id:
          type: string
          examples: [sess_a1b2c3d4]
        status:
          $ref: "#/components/schemas/SessionStatus"
        requestedDevices:
          type: integer
        allocatedDevices:
          type: integer
        api:
          type: string
        deviceType:
          type: string
        adbServers:
          type: array
          items:
            $ref: "#/components/schemas/AdbServer"
        queuePosition:
          type: integer
          description: 1-based position in the queue while `PENDING`.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        owner:
          type: string
          description: Name of the client that created the session.
        name:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        priority:
          type: integer
        idleTimeoutSeconds:
          type: integer
          format: int64
        labels:
          type: object
          additionalProperties:
            type: string
        deviceIds:
          type: array
          items:
            type: string
        devices:
          type: array
          description: Devices held while READY, for providers that report individual devices.
          items:
            $ref: "#/components/schemas/SessionDevice"
        lastHeartbeatAt:
          type: string
          format: date-time
    PoolStatus:
      type: object
      required: [available, busy, total]
      properties:
        available:
          type: integer
        busy:
          type: integer
        total:
          type: integer
    DevicesResponse:
      type: object
      required: [providers, totalAvailable, totalBusy]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderStatus"
        totalAvailable:
          type: integer
        totalBusy:
          type: integer
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    DeviceState:
      type: string
      enum: [available, busy, offline, maintenance]
    Device:
      type: object
      required: [id, provider, localId, deviceType, state]
      properties:
        id:
          type: string
          description: Global id, `<provider>:<device id>`.
        provider:
          type: string
        localId:
          type: string
        deviceType:
          type: string
        state:
          $ref: "#/components/schemas/DeviceState"
        apiLevel:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        abi:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        details:
          type: object
          additionalProperties:
            type: string
        sessionId:
          type: string
        owner:
          type: string
        maintenance:
          $ref: "#/components/schemas/Maintenance"
    Maintenance:
      type: object
      required: [by, since]
      properties:
        reason:
          type: string
        by:
          type: string
        since:
          type: string
          format: date-time
    MaintenanceRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    ProviderInfo:
      type: object
      required: [name, source, url, active]
      properties:
        name:
          type: string
        source:
          type: string
          enum: [static, registered]
        url:
          type: string
        accessHost:
          type: string
        adapterType:
          type: string
        healthy:
          type: boolean
        active:
          type: boolean
          description: False for a registration whose heartbeat lapsed.
        registeredBy:
          type: string
        registeredAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    ProviderRegistrationRequest:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"
        url:
          type: string
          description: Base URL the manager uses to reach the adapter.
        accessHost:
          type: string
        secret:
          type: string
          description: The adapter's ADAPTER_SECRET, so the manager can call it back.
        adapterType:
          type: string
    ProviderRegistrationResponse:
      type: object
      required: [name, heartbeatIntervalSeconds, ttlSeconds]
      properties:
        name:
          type: string
        heartbeatIntervalSeconds:
          type: integer
          format: int64
        ttlSeconds:
          type: integer
          format: int64
    Event:
      type: object
      required: [id, type, at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          examples: [session.ready, device.maintenance, provider.down]
        at:
          type: string
          format: date-time
        data:
          type: object
    ProviderStatus:
      type: object
      required: [name, adbHost, adbPort, access, capabilities, inventory, pool, status]
      properties:
        name:
          type: string
        adbHost:
          type: string
        adbPort:
          type: integer
        access:
          $ref: "#/components/schemas/AdapterAccess"
        capabilities:
          $ref: "#/components/schemas/AdapterCapabilities"
        inventory:
          type: array
          items:
            $ref: "#/components/schemas/AdapterDeviceProfile"
        pool:
          $ref: "#/components/schemas/PoolStatus"
        status:
          type: string
          enum: [HEALTHY, UNREACHABLE]
    AdapterAccess:
      type: object
      properties:
        preferredConnectionId:
          type: string
        connections:
          type: array
          items:
            $ref: "#/components/schemas/AdapterConnection"
        metadata:
          type: object
          additionalProperties:
            type: string
    AdapterConnection:
      type: object
      required: [id, protocol, transport, host, port, exposure]
      properties:
        id:
          type: string
        protocol:
          type: string
          examples: [adb]
        transport:
          type: string
          examples: [tcp]
        host:
          type: string
        port:
          type: integer
        exposure:
          type: string
          examples: [direct-tcp]
        auth:
          $ref: "#/components/schemas/AdapterConnectionAuth"
        metadata:
          type: object
          additionalProperties:
            type: string
    AdapterConnectionAuth:
      type: object
      properties:
        type:
          type: string
          default: network
        metadata:
          type: object
          additionalProperties:
            type: string
    AdapterCapabilities:
      type: object
      properties:
        allocationModes:
          type: array
          items:
            type: string
        supportedProtocols:
          type: array
          items:
            type: string
        supportedExposureModes:
          type: array
          items:
            type: string
        supportedDeviceTypes:
          type: array
          items:
            type: string
        supportedApiLevels:
          type: array
          items:
            type: string
        supportsSelectiveApiAllocation:
          type: boolean
        supportsTestAccessAdb:
          type: boolean
        supportsTestAccessGrpc:
          type: boolean
        supportsTestAccessConsole:
          type: boolean
        features:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    AdapterDeviceProfile:
      type: object
      required: [deviceType, count]
      properties:
        deviceType:
          type: string
        apiLevel:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        abi:
          type: string
        count:
          type: integer
        metadata:
          type: object
          additionalProperties:
            type: string
    LivenessResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          examples: [alive]
        version:
          type: string
    ReadinessResponse:
      type: object
      required: [status, version, checks]
      properties:
        status:
          type: string
          enum: [ready, not-ready]
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
    ProviderHealthSummary:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [HEALTHY, UNREACHABLE]
        available:
          type: integer
        busy:
          type: integer
        total:
          type: integer
        error:
          type: string
    SessionCounts:
      type: object
      required: [pending, ready, allocatedDevices]
      properties:
        pending:
          type: integer
        ready:
          type: integer
        allocatedDevices:
          type: integer
    HealthResponse:
      type: object
      required: [status, version, providersTotal, providersHealthy, providers]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        providersTotal:
          type: integer
        providersHealthy:
          type: integer
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderHealthSummary"
        sessions:
          $ref: "#/components/schemas/SessionCounts"
        checkedAt:
          type: string
          format: date-time
    ProviderConfig:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
        url:
          type: string
          description: Base URL of the adapter, e.g. `http://192.168.1.10:7037`.
        accessHost:
          type: string
          description: Host published to test runners when it differs from the host in `url`.
        secret:
          type: string
          description: Bearer token matching the adapter's `ADAPTER_SECRET`. Returned as `<redacted>`.
    NoDeviceStrategyConfig:
      type: object
      properties:
        mode:
          type: string
          enum: [FAIL_IMMEDIATELY, WAIT_WITH_TIMEOUT]
        waitTimeoutSeconds:
          type: integer
          format: int64
    MonitoringConfig:
      type: object
      properties:
        providerPollIntervalSeconds:
          type: integer
          format: int64
          default: 10
        providerPollTimeoutSeconds:
          type: integer
          format: int64
          default: 5
    AdapterTimeoutsConfig:
      type: object
      properties:
        healthSeconds:
          type: integer
          format: int64
          default: 5
        statusSeconds:
          type: integer
          format: int64
          default: 10
        acquireSeconds:
          type: integer
          format: int64
          default: 600
        releaseSeconds:
          type: integer
          format: int64
          default: 60
    ShepherdConfig:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderConfig"
        noDeviceStrategy:
          $ref: "#/components/schemas/NoDeviceStrategyConfig"
        monitoring:
          $ref: "#/components/schemas/MonitoringConfig"
        adapterTimeouts:
          $ref: "#/components/schemas/AdapterTimeoutsConfig"
        quotas:
          $ref: "#/components/schemas/QuotasConfig"
        audit:
          $ref: "#/components/schemas/AuditConfig"
        scheduler:
          $ref: "#/components/schemas/SchedulerConfig"
        registration:
          $ref: "#/components/schemas/RegistrationConfig"
        reconciliation:
          $ref: "#/components/schemas/ReconciliationConfig"
    SchedulerConfig:
      type: object
      properties:
        policy:
          type: string
          enum: [fifo, priority]
          default: fifo
    RegistrationConfig:
      type: object
      properties:
        heartbeatIntervalSeconds:
          type: integer
          format: int64
          default: 30
        ttlSeconds:
          type: integer
          format: int64
          default: 90
    ReconciliationConfig:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        intervalSeconds:
          type: integer
          format: int64
          default: 300
    QuotasConfig:
      type: object
      properties:
        defaults:
          $ref: "#/components/schemas/Quota"
    AuditConfig:
      type: object
      properties:
        retentionDays:
          type: integer
          format: int64
          default: 90
    Quota:
      type: object
      description: Client limits; an absent or null field is not limited.
      properties:
        maxDevices:
          type: [integer, "null"]
          minimum: 1
          description: Devices the client may hold or wait for at once.
        maxSessionLifetimeSeconds:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: Upper bound for a session's life; longer TTLs are shortened.
        maxPriority:
          type: [integer, "null"]
          minimum: 0
    Role:
      type: string
      enum: [admin, user, viewer, provider]
    Client:
      type: object
      required: [id, name, role, keyPrefix, active, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        keyPrefix:
          type: string
          description: First characters of the key; the key itself is shown only once.
        description:
          type: string
        quota:
          $ref: "#/components/schemas/Quota"
        effectiveQuota:
          $ref: "#/components/schemas/Quota"
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    CreateClientRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
        role:
          $ref: "#/components/schemas/Role"
        description:
          type: string
        quota:
          $ref: "#/components/schemas/Quota"
    UpdateClientRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
        description:
          type: string
        quota:
          $ref: "#/components/schemas/Quota"
    ClientKeyResponse:
      type: object
      required: [client, apiKey]
      properties:
        client:
          $ref: "#/components/schemas/Client"
        apiKey:
          type: string
          description: Shown exactly once.
    Usage:
      type: object
      required: [activeSessions, devices]
      properties:
        activeSessions:
          type: integer
        devices:
          type: integer
    WhoAmI:
      type: object
      required: [id, name, role, quota, usage]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [user, client]
          description: A person (signed in or with a personal token) or an API client.
        role:
          $ref: "#/components/schemas/Role"
        quota:
          $ref: "#/components/schemas/Quota"
        usage:
          $ref: "#/components/schemas/Usage"
    AuditEntry:
      type: object
      required: [id, at, actor, action, outcome]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actor:
          type: string
        actorId:
          type: string
        action:
          type: string
          examples: [session.create]
        target:
          type: string
        outcome:
          type: string
          enum: [success, denied, failed]
        details:
          type: object
          additionalProperties:
            type: string
        origin:
          type: string
    AuditPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextBefore:
          type: integer
          format: int64
    User:
      type: object
      required: [id, username, source, role, active, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        source:
          type: string
          enum: [local, ldap, oidc]
        provider:
          type: string
          description: The OIDC provider id, or `ldap`.
        role:
          $ref: "#/components/schemas/Role"
        roleManagedByProvider:
          type: boolean
          description: Directory groups decide the role at every sign-in, so it cannot be edited.
        quota:
          $ref: "#/components/schemas/Quota"
        effectiveQuota:
          $ref: "#/components/schemas/Quota"
        active:
          type: boolean
        mustChangePassword:
          type: boolean
        unclaimed:
          type: boolean
          description: The account the manager created at first start, waiting to be taken over.
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        lastLoginAt:
          type: string
          format: date-time
        disabledAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
        password:
          type: string
          description: Omit to have a temporary password generated.
        displayName:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        quota:
          $ref: "#/components/schemas/Quota"
    CreatedUser:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        temporaryPassword:
          type: string
          description: Only when generated; shown once.
    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          description: Renames a local account; a name a directory gave cannot be changed here.
        displayName:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        quota:
          $ref: "#/components/schemas/Quota"
        active:
          type: boolean
    ResetPasswordRequest:
      type: object
      properties:
        password:
          type: string
    PasswordReset:
      type: object
      properties:
        temporaryPassword:
          type: string
    AuthMethods:
      type: object
      required: [local, ldap]
      properties:
        local:
          type: boolean
        ldap:
          type: boolean
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AuthProvider"
        signInError:
          type: string
          description: Why the last OIDC sign-in in this browser failed; returned once.
    AuthProvider:
      type: object
      required: [id, displayName, loginUrl]
      properties:
        id:
          type: string
        displayName:
          type: string
        loginUrl:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    WebSession:
      type: object
      required: [user, csrfToken, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    SetUpAccountRequest:
      type: object
      required: [newPassword]
      properties:
        username:
          type: string
          description: A name for an unclaimed account; leave it out to keep the current one.
        displayName:
          type: string
        newPassword:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
    ChangePasswordWithLoginRequest:
      type: object
      required: [username, currentPassword, newPassword]
      properties:
        username:
          type: string
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
    PersonalToken:
      type: object
      required: [id, name, prefix, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 3650
    TokenLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        name:
          type: string
          default: mshctl
        expiresInDays:
          type: integer
          default: 90
    IssuedToken:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/PersonalToken"
        secret:
          type: string
          description: Shown once; send it as a bearer key.
