name: Release

# Publishes the container images to GHCR and cuts a GitHub release when a version tag
# (vX.Y.Z) is pushed. Authentication is the workflow's own GITHUB_TOKEN — no secrets.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: marathon-shepherd
            dockerfile: deploy/Dockerfile
          - image: shepherd-adb
            dockerfile: deploy/Dockerfile.shepherd-adb
          - image: shepherd-farm
            dockerfile: deploy/Dockerfile.shepherd-farm
          - image: shepherd-cuttlefish
            dockerfile: deploy/Dockerfile.shepherd-cuttlefish
    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated only for the runtime stage; the Gradle builder stage runs on the
      # native platform (FROM --platform=$BUILDPLATFORM), since bytecode is portable.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action also sets org.opencontainers.image.source, which links each
      # package to this repository.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          {
            echo
            echo '### Container images'
            echo
            for image in marathon-shepherd shepherd-adb shepherd-farm shepherd-cuttlefish; do
              echo "- \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:${version}\`"
            done
          } >> release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
