name: Docker tiers

# The Docker-backed component, integration, e2e and scale tiers, run on demand.
#
# They are not part of the push/PR gate because two of them test the environment as much
# as the code. On a GitHub-hosted runner:
#
#   - [integration] expects a working Cuttlefish backend behind the Cloud Orchestrator,
#     which needs KVM; hosted runners have none. The component and e2e tiers already
#     treat an unavailable backend as a skip.
#   - [scale] enforces latency thresholds (session create p95 < 2 s) that a shared
#     hosted runner, busy with every other stage in parallel, does not reliably meet.
#
# Everything else here passes on a hosted runner. For the full set, run the tiers on a
# KVM-capable self-hosted agent via the Jenkinsfile (RUN_DOCKER_TIERS).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Docker tiers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # The component CLI stage drives a local adb server and the Jenkins stage runs the
      # shared-library harness under Groovy; neither ships on hosted runners.
      - name: Install adb and Groovy
        run: |
          sudo apt-get update
          sudo apt-get install -y adb groovy

      # Device-backed tiers cannot run here at all: a hosted runner has no Android device.
      - name: Component and integration tiers
        run: |
          ./tests/run_tests.sh \
            --skip-real-device \
            --skip-apk-e2e
