name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref — a PR push should not queue behind its own
# earlier build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # Fails the build if the checked-in wrapper jar is not a genuine Gradle release.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build
        run: ./gradlew build -x test --console=plain

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore
          retention-days: 7

  jenkins-library:
    name: Jenkins shared library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Groovy
        run: |
          sudo apt-get update
          sudo apt-get install -y groovy

      # Exercises vars/runMarathonWithShepherd.groovy against mocked pipeline steps.
      - name: Shared-library unit tests
        run: groovy tests/unit/jenkins_unit_test.groovy

  runner:
    name: Test runner self-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # The runner is the documented entry point, so CI must prove it works with only
      # the tools a hosted runner has: no adb, no Groovy, no Docker daemon needed for
      # this tier. Regressions here are what made `--only` unusable before.
      - name: Kotlin unit tier through the runner
        run: ./tests/run_tests.sh --only unit:kotlin

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: ktlint
        run: ./gradlew ktlintCheck --console=plain

      - name: Shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # Informational for now: the suite predates shellcheck and is not yet clean.
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=error || \
            echo "::warning::shellcheck reported error-level findings"

      - name: Python syntax
        run: |
          python3 -m compileall -q tests/ scripts/ 2>&1

  docker:
    name: Docker tiers
    runs-on: ubuntu-latest
    # Docker-backed tiers are slow and pull upstream images; run them on master and on
    # demand rather than on every PR push.
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # Device-backed tiers cannot run here: a hosted runner has no Android device and
      # no nested-virtualisation Cuttlefish host. They run on self-hosted Jenkins
      # agents instead — see Jenkinsfile.
      - name: Component and integration tiers
        run: |
          ./tests/run_tests.sh \
            --skip-real-device \
            --skip-apk-e2e
