version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Ktor and Kotlin releases move as a set; separate PRs per artifact are noise.
      ktor:
        patterns: ['io.ktor:*']
      kotlin:
        patterns: ['org.jetbrains.kotlin*', 'org.jetbrains.kotlinx:*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /deploy
      - /tests/component/docker
    schedule:
      interval: weekly
