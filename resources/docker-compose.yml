version: "3.8"

services:
  farm-server:
    build:
      context: ../deploy
      dockerfile: Dockerfile.farm-server
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/kvm
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      --max_amount 5
      --keep_alive_devices 2
      -i us-docker.pkg.dev/mobiledevops/android-emulator/linux-arm64:34
      --device_busy_timeout 7200
      --emulator_params "-no-snapshot -no-audio -no-window -gpu swiftshader_indirect -qemu -machine gic-version=2"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
