kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
# Build parallelism — independent modules compile / test concurrently.
org.gradle.parallel=true
# Daemon + filesystem watching keep the warm cache usable across runs.
org.gradle.daemon=true
org.gradle.vfs.watch=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
# Limit worker count to keep Docker-heavy stages room to breathe.
# Override at runner-launch time with `-Dorg.gradle.workers.max=...` if needed.

# Project version — single source of truth (see build.gradle.kts).
shepherdVersion=0.1.0
