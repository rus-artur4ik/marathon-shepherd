# Component test stack — builds and validates local Docker images.
# Images are built from the local Dockerfiles (repo root context).
# Run from repo root: docker compose -f tests/component/docker/docker-compose.smoke.yml up --build

services:
  adb:
    build:
      context: ../../..
      dockerfile: deploy/Dockerfile.adb-server
    image: msh-adb-server-smoke:latest
    container_name: msh-smoke-adb
    restart: unless-stopped
    networks:
      - msh-smoke
    healthcheck:
      test: ["CMD", "adb", "devices"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 3s

  farm-server:
    image: python:3.12-alpine
    container_name: msh-smoke-farm-server
    command: ["python", "/opt/integration/farm_server.py"]
    environment:
      FARM_SERVER_HOST: "0.0.0.0"
      FARM_SERVER_PORT: "8080"
      FARM_SERVER_TOTAL: "3"
      FARM_SERVER_AVAILABLE: "3"
    volumes:
      - "../../integration:/opt/integration:ro"
    networks:
      - msh-smoke
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 3s

  shepherd-adb:
    build:
      context: ../../..
      dockerfile: tests/component/docker/Dockerfile.shepherd-adb
    image: msh-shepherd-adb-smoke:latest
    container_name: msh-smoke-shepherd-adb
    depends_on:
      adb:
        condition: service_healthy
    environment:
      ADAPTER_PORT: "7037"
      ADAPTER_ADB_PORT: "5037"
      ADB_SERVER_SOCKET: "tcp:adb:5037"
      ADAPTER_SECRET: "smoke-secret-adb"
    networks:
      - msh-smoke
    ports:
      - "17037:7037"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7037/health"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 3s

  shepherd-farm:
    build:
      context: ../../..
      dockerfile: tests/component/docker/Dockerfile.shepherd-farm
    image: msh-shepherd-farm-smoke:latest
    container_name: msh-smoke-shepherd-farm
    depends_on:
      farm-server:
        condition: service_healthy
    environment:
      ADAPTER_PORT: "7037"
      ADAPTER_ADB_PORT: "5037"
      FARM_SERVER_HOST: "farm-server"
      FARM_SERVER_PORT: "8080"
      FARM_SUPPORTED_API_LEVELS: "34"
      ADAPTER_SECRET: "smoke-secret-farm"
    networks:
      - msh-smoke
    ports:
      - "17038:7037"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7037/health"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 3s

  cuttlefish-orchestrator:
    build:
      context: ../../..
      dockerfile: deploy/Dockerfile.cloud-orchestrator
      args:
        CLOUD_ANDROID_ORCHESTRATION_REF: "${CLOUD_ANDROID_ORCHESTRATION_REF:-main}"
    image: msh-smoke-cuttlefish-orchestrator:latest
    container_name: msh-smoke-cuttlefish-orchestrator
    environment:
      CONFIG_FILE: "/conf.toml"
    volumes:
      - "${CUTTLEFISH_ORCHESTRATOR_CONFIG_PATH:?CUTTLEFISH_ORCHESTRATOR_CONFIG_PATH must be set}:/conf.toml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - msh-smoke

  shepherd-cuttlefish:
    build:
      context: ../../..
      dockerfile: tests/component/docker/Dockerfile.shepherd-cuttlefish
    image: msh-shepherd-cuttlefish-smoke:latest
    container_name: msh-smoke-shepherd-cuttlefish
    depends_on:
      cuttlefish-orchestrator:
        condition: service_started
    environment:
      ADAPTER_PORT: "7037"
      ADAPTER_ADB_PORT: "6520"
      ADAPTER_SECRET: "smoke-secret-cuttlefish"
      CUTTLEFISH_ORCHESTRATOR_URL: "http://cuttlefish-orchestrator:8080"
      CUTTLEFISH_ORCHESTRATOR_LEASES_PATH: "/var/lib/cuttlefish/leases.json"
      CUTTLEFISH_ORCHESTRATOR_INSECURE_TLS: "false"
    volumes:
      - msh-smoke-cuttlefish:/var/lib/cuttlefish
    networks:
      - msh-smoke
    ports:
      - "17039:7037"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7037/health"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 3s

  manager:
    build:
      context: ../../..
      dockerfile: tests/component/docker/Dockerfile
    image: msh-manager-smoke:latest
    container_name: msh-smoke-manager
    depends_on:
      shepherd-adb:
        condition: service_healthy
      shepherd-farm:
        condition: service_healthy
      shepherd-cuttlefish:
        condition: service_healthy
    environment:
      MSH_PORT: "6037"
      MSH_CONFIG: "/etc/msh/msh.yaml"
      MSH_DATA_DIR: "/var/lib/msh"
    volumes:
      - "../../integration/msh.smoke.yaml:/etc/msh/msh.yaml:ro"
      - msh-smoke-data:/var/lib/msh
    ports:
      - "16037:6037"
    networks:
      - msh-smoke
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6037/live"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 3s

volumes:
  msh-smoke-data:
  msh-smoke-cuttlefish:

networks:
  msh-smoke:
    driver: bridge
