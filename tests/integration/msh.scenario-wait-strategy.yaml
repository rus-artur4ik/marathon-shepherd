# E2E scenario: farm-only provider with WAIT_WITH_TIMEOUT strategy.
# When all devices are busy/absent the manager polls for 15 seconds before failing.
providers:
  - name: "integration-farm"
    url: "http://shepherd-farm:7037"
    accessHost: "farm-server"
    secret: "integration-secret-farm"
noDeviceStrategy:
  mode: WAIT_WITH_TIMEOUT
  waitTimeoutSeconds: 15
