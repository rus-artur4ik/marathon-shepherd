# Marathon Shepherd server stack:
# - msh-manager
# - cuttlefish orchestrator
# - shepherd-cuttlefish adapter
#
# Before first start:
# 1. Edit `deploy/msh.cuttlefish-server.yaml` and replace:
#    - `YOUR_SERVER_HOST_OR_IP`
#    - `CHANGE_ME_TO_A_LONG_RANDOM_SECRET`
# 2. Keep the same secret below in `ADAPTER_SECRET`.
# 3. Provide a Cloud Orchestrator config file and export:
#    CUTTLEFISH_ORCHESTRATOR_CONFIG_PATH=/absolute/path/to/conf.toml
#
# Start:
#   docker compose -f deploy/docker-compose.server-cuttlefish.yml up -d

services:
  cuttlefish:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.cloud-orchestrator
      args:
        CLOUD_ANDROID_ORCHESTRATION_REF: "${CLOUD_ANDROID_ORCHESTRATION_REF:-main}"
    container_name: msh-cuttlefish
    restart: unless-stopped
    environment:
      CONFIG_FILE: "/conf.toml"
    volumes:
      - "${CUTTLEFISH_ORCHESTRATOR_CONFIG_PATH:?CUTTLEFISH_ORCHESTRATOR_CONFIG_PATH must be set}:/conf.toml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"

  shepherd-cuttlefish:
    image: ghcr.io/rus-artur4ik/shepherd-cuttlefish:0.1.0
    container_name: shepherd-cuttlefish
    depends_on:
      cuttlefish:
        condition: service_started
    restart: unless-stopped
    environment:
      ADAPTER_PORT: "7037"
      ADAPTER_ADB_PORT: "6520"
      ADAPTER_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET"
      CUTTLEFISH_ORCHESTRATOR_URL: "http://cuttlefish:8080"
      CUTTLEFISH_ORCHESTRATOR_USERNAME: "shepherd-cuttlefish"
      CUTTLEFISH_ORCHESTRATOR_INSECURE_TLS: "false"
      CUTTLEFISH_ORCHESTRATOR_LEASES_PATH: "/var/lib/cuttlefish/leases.json"
    volumes:
      - cuttlefish-adapter-data:/var/lib/cuttlefish
    ports:
      - "6520:6520"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7037/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  manager:
    image: ghcr.io/rus-artur4ik/marathon-shepherd:0.1.0
    container_name: msh-manager
    depends_on:
      shepherd-cuttlefish:
        condition: service_healthy
    restart: unless-stopped
    environment:
      MSH_PORT: "6037"
      MSH_CONFIG: "/etc/msh/msh.yaml"
      MSH_DATA_DIR: "/var/lib/msh"
    volumes:
      - "./msh.cuttlefish-server.yaml:/etc/msh/msh.yaml:ro"
      - manager-data:/var/lib/msh
    ports:
      - "6037:6037"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6037/live"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cuttlefish-adapter-data:
  manager-data:
