apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marathon-shepherd.fullname" . }}
  labels:
    {{- include "marathon-shepherd.labels" . | nindent 4 }}
spec:
  # One manager per database: it holds the session state and takes a startup lock.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "marathon-shepherd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "marathon-shepherd.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: MSH_PORT
              value: {{ .Values.service.port | quote }}
            - name: MSH_CONFIG
              value: /etc/msh/{{ .Values.config.key }}
            - name: MSH_DATA_DIR
              value: /var/lib/msh
            {{- if or .Values.adminToken.value .Values.adminToken.existingSecret }}
            - name: MSH_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminToken.existingSecret | default (include "marathon-shepherd.fullname" .) }}
                  key: {{ .Values.adminToken.key }}
            {{- end }}
            {{- if .Values.database.existingSecret }}
            - name: MSH_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.key }}
            {{- else if .Values.database.url }}
            - name: MSH_DB_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/msh
              readOnly: true
            - name: data
              mountPath: /var/lib/msh
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: {{ include "marathon-shepherd.configSecret" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "marathon-shepherd.claim" . }}
          {{- else }}
          # Without a volume the session database and the generated admin key are lost on restart.
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
