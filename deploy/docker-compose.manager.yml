# Marathon Shepherd — Manager
#
# Defaults (no env vars needed for local use):
#   ./msh.yaml   → /etc/msh/msh.yaml  (config)
#   ./msh-data   → /var/lib/msh       (SQLite state)
#
# Set MSH_DATA_PATH to control where manager state is persisted on the host.
#
#   MSH_DATA_PATH=/opt/msh docker compose -f deploy/docker-compose.manager.yml up -d

services:
  manager:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ghcr.io/rus-artur4ik/marathon-shepherd:0.2.0
    container_name: msh-manager
    restart: unless-stopped
    environment:
      # Optional first password of the `admin` user. Without it the manager generates a
      # one-time password on first start, prints it once and stores it in
      # /var/lib/msh/initial-admin-password.
      MSH_ADMIN_PASSWORD: "${MSH_ADMIN_PASSWORD:-}"
      # Optional static admin API key for automation.
      MSH_ADMIN_TOKEN: "${MSH_ADMIN_TOKEN:-}"
      # Optional Postgres backend, e.g.
      # jdbc:postgresql://db:5432/shepherd?user=shepherd&password=...
      # Empty keeps the SQLite file in /var/lib/msh.
      MSH_DB_URL: "${MSH_DB_URL:-}"
    volumes:
      - "${MSH_CONFIG_PATH:-./msh.yaml}:/etc/msh/msh.yaml:ro"
      - "${MSH_DATA_PATH:-./msh-data}:/var/lib/msh"
    ports:
      - "6037:6037"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6037/live"]
      interval: 30s
      timeout: 5s
      retries: 3
